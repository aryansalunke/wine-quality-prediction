<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Quality Prediction</title>
    <style>
        /* General body styling */
        body {
            background-color: #000000; /* Black background */
            color: #ffffff; /* White text */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Changed from center to flex-start for better alignment */
            min-height: 100vh; /* Ensure the body takes full height */
            overflow: auto; /* Allow scrolling if content exceeds viewport */
        }

        /* Page title */
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ffcc00; /* Golden title color */
            text-align: center;
        }

        /* Form styling */
        form {
            background-color: #1a1a1a; /* Dark gray form background */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); /* Subtle glow effect */
            width: 300px;
            margin-bottom: 20px;
        }

        /* Labels */
        form label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #ffffff;
        }

        /* Input fields */
        form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            background-color: #333333; /* Darker input background */
            color: #ffffff; /* White text */
            font-size: 1em;
        }

        /* Input focus styling */
        form input:focus {
            outline: none;
            border-color: #ffcc00; /* Golden border on focus */
            box-shadow: 0 0 5px #ffcc00; /* Glow effect */
        }

        /* Submit button */
        form button {
            background-color: #ffcc00; /* Golden button background */
            color: #000000; /* Black button text */
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        /* Submit button hover effect */
        form button:hover {
            background-color: #e6b800; /* Darker gold on hover */
        }

        /* Prediction text */
        h3 {
            margin-top: 20px;
            color: #00ff00; /* Green color for the prediction */
            text-align: center;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>Wine Quality Prediction</h1>
    <form action="/predict" method="POST">
        <label for="type">Type (0 for Red, 1 for White):</label>
        <input type="number" name="type" step="1" min="0" max="1" required><br>

        <label for="fixed_acidity">Fixed Acidity:</label>
        <input type="number" name="fixed_acidity" step="any" required><br>

        <label for="volatile_acidity">Volatile Acidity:</label>
        <input type="number" name="volatile_acidity" step="any" required><br>

        <label for="citric_acid">Citric Acid:</label>
        <input type="number" name="citric_acid" step="any" required><br>

        <label for="residual_sugar">Residual Sugar:</label>
        <input type="number" name="residual_sugar" step="any" required><br>

        <label for="chlorides">Chlorides:</label>
        <input type="number" name="chlorides" step="any" required><br>

        <label for="free_sulfur_dioxide">Free Sulfur Dioxide:</label>
        <input type="number" name="free_sulfur_dioxide" step="any" required><br>

        <label for="total_sulfur_dioxide">Total Sulfur Dioxide:</label>
        <input type="number" name="total_sulfur_dioxide" step="any" required><br>

        <label for="density">Density:</label>
        <input type="number" name="density" step="any" required><br>

        <label for="pH">pH:</label>
        <input type="number" name="pH" step="any" required><br>

        <label for="sulphates">Sulphates:</label>
        <input type="number" name="sulphates" step="any" required><br>

        <label for="alcohol">Alcohol:</label>
        <input type="number" name="alcohol" step="any" required><br>

        <button type="submit">Predict Wine Quality</button>
    </form>

    {% if prediction_text %}
    <h3>{{ prediction_text }}</h3>
    {% endif %}
</body>
</html>
